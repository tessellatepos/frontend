# Connection header for proxied requests: upgrade for WebSockets, plain
# keep-alive otherwise.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      "";
}

# Keep X-Forwarded-Proto from an upstream TLS-terminating proxy when present;
# otherwise describe this hop. Only the scheme is taken from the client side:
# the backend decides what to serve by the Host this proxy received, so Host
# and X-Forwarded-Host are never taken from request headers a client can set.
map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen       80;
  server_name  localhost;

  root /usr/share/nginx/html;
  index index.html;

  # Same paths the Vite dev server proxies to the backend. /plugins/<name>
  # alone is the frontend's plugin page, so only /plugins/<name>/... proxies.
  location ~ ^/((api|auth|gateway|webhooks|ws)(/|$)|plugins/[^/]+/) {
    # Variable + resolver defers DNS lookup to request time, so nginx starts
    # even when the backend isn't up yet
    resolver ${DNS_RESOLVER} valid=10s;
    set $backend ${BACKEND_URL};
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # $proxy_add_x_forwarded_for appends to an existing header
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-Host $http_host;
    # Keep idle WebSockets open (the client reconnects if one drops)
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
